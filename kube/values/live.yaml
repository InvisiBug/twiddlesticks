name: twiddlesticks

namespace: kavanest
env:
  APP_VERSION: 8af070a072ac84e3aefd8bb91496c0004ec19e60

deployment:
  - name: twiddlesticks
    image: invisibug/twiddlesticks
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: twiddlesticks.co.uk
    selector: twiddlesticks
    path: /.*
    port: 80
    host: twiddlesticks.co.uk

service:
  loadBalancer:
    - name: twiddlesticks
      selector: twiddlesticks
      port: 80
