name: twiddlesticks

namespace: kavanest
env:
  APP_VERSION: 7da9a01307063e16c1497daf1b410b1dd2dccf10

deployment:
  - name: twiddlesticks
    image: invisibug/twiddlesticks
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: twiddlesticks.co.uk
    selector: twiddlesticks
    path: /.*
    port: 80
    host: twiddlesticks.co.uk

service:
  loadBalancer:
    - name: twiddlesticks
      selector: twiddlesticks
      port: 80
