name: twiddlesticks

namespace: kavanest
env:
  APP_VERSION: 7da9a01307063e16c1497daf1b410b1dd2dccf10

deployment:
  - name: twiddlesticks
    image: invisibug/twiddlesticks
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

service:
  name: twiddlesticks
  selector: twiddlesticks
  port: 80
  targetPort: 80

httpRoute:
  name: twiddlesticks
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: twiddlesticks.co.uk
  path: /
  serviceName: twiddlesticks
  servicePort: 80

