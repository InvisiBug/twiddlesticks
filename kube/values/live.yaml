name: twiddlesticks

namespace: kavanest
env:
  APP_VERSION: 4ab430b94ef9ad3564eb5ca6541e077b9cd3f035

deployment:
  - name: twiddlesticks
    image: invisibug/twiddlesticks
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: twiddlesticks.co.uk
    selector: twiddlesticks
    path: /.*
    port: 80
    host: twiddlesticks.co.uk

service:
  loadBalancer:
    - name: twiddlesticks
      selector: twiddlesticks
      port: 80
