name: twiddlesticks

namespace: kavanest
env:
  APP_VERSION: 63e0bbd2d8189c4f13451e0869c42f3df98ddb8c

deployment:
  - name: twiddlesticks
    image: invisibug/twiddlesticks
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: twiddlesticks.co.uk
    selector: twiddlesticks
    path: /.*
    port: 80
    host: twiddlesticks.co.uk

service:
  loadBalancer:
    - name: twiddlesticks
      selector: twiddlesticks
      port: 80
